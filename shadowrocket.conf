# Personal Shadowrocket overrides over Johnshall lazy.conf
# Upstream: https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/lazy.conf
# Custom rules take priority over the included upstream configuration.

[General]
include = https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/lazy.conf

# Region-specific proxy groups. Nodes are selected by their names.
[Proxy Group]
UK = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=0,timeout=5,policy-regex-filter=UK|United Kingdom|Britain|英国|伦敦|London
HK = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=0,timeout=5,policy-regex-filter=HK|Hong Kong|香港|港

[Rule]
# Local and private networks
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve

# Financial services take precedence over ad-blocking to reduce false positives.
RULE-SET,https://raw.githubusercontent.com/acshiryu/shadowrocket-rules/master/rules/direct.list,DIRECT
# Finance routing is split into three explicit categories.
RULE-SET,https://raw.githubusercontent.com/acshiryu/shadowrocket-rules/master/rules/finance-domestic.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/acshiryu/shadowrocket-rules/master/rules/finance-direct.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/acshiryu/shadowrocket-rules/master/rules/finance-overseas-uk.list,UK
RULE-SET,https://raw.githubusercontent.com/acshiryu/shadowrocket-rules/master/rules/finance-overseas-hk.list,HK

# Johnshall's ad-only rules (separate from the included lazy configuration).
# If Shadowrocket reports RULE-SET parsing errors for this complete .conf,
# disable this entry and use the alternative pure rule list documented in README.
RULE-SET,https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/sr_ad_only.conf,REJECT

# Personal proxy overrides.
RULE-SET,https://raw.githubusercontent.com/acshiryu/shadowrocket-rules/master/rules/ai.list,PROXY
# Apple and Microsoft are independently maintained and direct by default.
RULE-SET,https://raw.githubusercontent.com/acshiryu/shadowrocket-rules/master/rules/apple.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/acshiryu/shadowrocket-rules/master/rules/microsoft.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/acshiryu/shadowrocket-rules/master/rules/proxy.list,PROXY

# Optional additional local blocking (disabled to avoid duplicate or untested rules):
# RULE-SET,https://raw.githubusercontent.com/acshiryu/shadowrocket-rules/master/rules/reject.list,REJECT
